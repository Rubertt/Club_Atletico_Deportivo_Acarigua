# =====================================================================
# CONFIGURACIÓN DE APACHE PARA CLUB ATLÉTICO DEPORTIVO ACARIGUA
# =====================================================================
# Pegar esta configuración al final del archivo de XAMPP:
# C:\xampp\apache\conf\extra\httpd-xampp.conf
#
# Luego, reiniciar el servidor Apache desde el Panel de Control de XAMPP.

Alias /cada "C:/Users/Estudio/Documents/proyectos codex/cada_stable/public"

<Directory "C:/Users/Estudio/Documents/proyectos codex/cada_stable/public">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Redirige /cada sin barra al final hacia /cada/ para que funcione mod_rewrite correctamente
RedirectMatch 301 ^/cada$ /cada/
